openapi: 3.0.3

# etoki の HTTP 契約の正本（SSoT）。
#
# このファイルを直したら `make codegen` を実行して Go / TypeScript の型を
# 再生成し、同じコミットに含める。CI の codegen-drift ジョブが再生成して
# 差分が出たら落とす。詳細は docs/adr/0011-openapi-as-contract-ssot.md。
#
# Go は `x-go-type-skip-optional-pointer` で optional をポインタにしない。
# JSON の `omitempty` だけで表現できる場所にポインタを増やすと、詰め替えが
# 冗長になるうえ nil と空値の区別に意味が無い。区別に意味がある
# `lastSyncedAt`（未実行か、実行済みか）だけはポインタのままにする。

info:
  title: etoki API
  description: |
    ホワイトボードのブレスト内容を Vision LLM に解釈させ、GitHub Projects v2 の
    draft issue に変換するためのローカル API。

    認証は任意。設定しなければ単一ユーザーのローカルツールとして動く（ADR 0004）。
    GitHub App を設定するとログインを要求し、`/api/**` は 401 を返しうる（ADR 0015）。

    ボードには所有者がある（ADR 0016）。他人のボードは ID を知っていても 404 を
    返す。403 にしないのは、ID の総当たりで存在を確かめられるようにしないため。
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: ローカル開発サーバー

tags:
  - name: health
    description: 死活確認
  - name: boards
    description: ボードとシーンの読み書き
  - name: annotations
    description: 注釈の状態・解釈・作成
  - name: github
    description: 作成先を選ぶための GitHub の一覧
  - name: auth
    description: ログインとセッション
  - name: members
    description: ボードの共有
  - name: capabilities
    description: いま使える機能

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: プロセスが生きていることを返す
      description: |
        DB や外部サービスの疎通確認は含めない。etoki は自動で外部に触らないという
        方針のため、ヘルスチェックが副作用を持たないようにしている。
      responses:
        "200":
          description: プロセスは生きている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/capabilities:
    get:
      tags: [capabilities]
      operationId: getCapabilities
      summary: いま使える機能を返す
      description: |
        LLM や GitHub を設定していなくても etoki は起動する（ADR 0008）。
        設定していない機能のエンドポイントは 503 を返すが、**それは押した後に
        しか分からない。** 押す前に「いまできないこと」を見せるための口。

        返すのはプロセスの設定であって、利用者ごとの権限ではない。ボード単位の
        可否は `GET /api/boards/{id}/access`（ADR 0017）。**混ぜないこと。**
        片方が「できる」でもう片方が「できない」は普通に起きる。
      responses:
        "200":
          description: いま使える機能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: ログイン状態を返す
      description: |
        **常に 200 を返す。** 未ログインを 401 で伝えると、認証を設定していない
        構成の起動時にも 401 が出て、本当の失効と見分けがつかなくなる。

        `authRequired` が false なら認証を設定していない。画面はログインを
        求めない（ADR 0015）。
      responses:
        "200":
          description: ログイン状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: startLogin
      summary: 認可画面の URL を発行する
      description: |
        **GET ではなく POST。** state の発行は書き込みであり、GET にすると
        外部ページの `<img>` から叩けてしまう。POST なら Origin 検証が効く
        （ADR 0013 / 0015）。

        遷移そのものはフロントが行う。サーバーからリダイレクトしないのは、
        fetch でのリダイレクト追跡が cross-origin で扱いにくいため。
      responses:
        "200":
          description: 送り出す先
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: 認証が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/callback:
    get:
      tags: [auth]
      operationId: completeLogin
      summary: 認可の結果を受け取ってセッションを張る
      description: |
        認証基盤からのトップレベル遷移。**etoki で唯一、副作用を持つ GET。**
        GET 以外にはできないので、`state` の照合で守る。サーバー発行・単回
        使用・期限つきなので、攻撃者は有効な値を用意できない（ADR 0015）。

        画面に戻すためのリダイレクトを返す。ブラウザ以外から叩く用途は無い。
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: |
            画面へ戻す。成功時だけでなく、state が古い・code を使い切った
            場合もここに来る。ブラウザのトップレベル遷移に JSON を返すと
            利用者が生のエラー本文を見ることになるため
        "400":
          description: code か state が付いていない（直接叩かれた場合）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: 認証が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: セッションを破棄する
      description: |
        GitHub 側のトークンは取り消さない。同じ利用者が別の端末からも使って
        いる可能性があり、片方のログアウトで全部を切るのは意図に合わない。
      responses:
        "204":
          description: 破棄した。もともとログインしていなくても 204
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards:
    get:
      tags: [boards]
      operationId: listBoards
      summary: ボードの一覧を返す
      description: シーンは大きいので一覧には含めない。
      responses:
        "200":
          description: ボードの一覧。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [boards]
      operationId: createBoard
      summary: ボードを作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: 作成したボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/SceneTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [boards]
      operationId: getBoard
      summary: ボードをシーンごと返す
      responses:
        "200":
          description: ボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [boards]
      operationId: renameBoard
      summary: ボードの名前を変える
      description: |
        名前だけを変える。シーンも作成先も触らない。

        **`updatedAt` は進めない。** あれはシーンの版であり、保存の照合基準
        （ADR 0020）として使われている。名前を直しただけで進めると、そのボードを
        開いている別のメンバーの次の保存が「他の人が保存しました」で断られる。
        誰もシーンを触っていないのに衝突として読まれることになる。

        変えられるのは editor 以上。作成先の変更（owner だけ）と揃えないのは、
        名前は取り消せない作成の行き先を決めるものではないため。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameBoardRequest"
      responses:
        "200":
          description: 改名後のボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [boards]
      operationId: deleteBoard
      summary: ボードを削除する
      description: |
        **owner だけ**（ADR 0017）。ボードごと畳む操作なので、シーンを書き換え
        られる editor ではなく、招待も作成先の変更もできる相手に限る。

        **GitHub 側の draft issue は消さない**（消せない。逆方向の書き込みは
        スコープ外）。消えるのは etoki 側の記録のほうで、`sync_runs` と
        `sync_items` と `board_members` が一緒に消える。その結果、**GitHub に
        残った draft issue がどのボードのどの注釈から作られたのかは辿れなく
        なる**（ADR 0007 / 0042）。

        何が残るのかは `GET /api/boards/{id}/deletion` で先に引ける。画面は
        押される前にそれを見せて確認させる（中核思想 3）。

        **run があっても拒まない。** 拒むと、いちばん畳みたいボード（作成先を
        間違えたまま 1 回作ってしまったボード）が永久に残る。判断の材料を
        見せたうえで、決めるのは開発者にする。
      responses:
        "204":
          description: 削除した
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/deletion:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [boards]
      operationId: getBoardDeletion
      summary: 削除で何が失われるかを返す
      description: |
        削除は取り消せず、GitHub 側に作った draft issue も消せない。押す前に
        何が残るのかを見せるための口（ADR 0042、中核思想 3）。

        **押されたときだけ引く。** ボードを開くたびに数えると、削除するまで
        要らない畳み込みを毎回引くことになる（ADR 0037 の取り直しと同じ形）。

        **owner だけ。** 削除そのものと揃える。押せない相手に、押したときに
        何が起きるかだけを見せる理由が無い。
      responses:
        "200":
          description: 削除で失われるもの
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDeletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/scene:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [boards]
      operationId: saveScene
      summary: シーンを保存する
      description: |
        3 状態の判定は保存済みシーンを基準にする。保存するまで編集中の内容は
        注釈の状態に反映されない。

        保存はシーン全体を書く。ボードは共有できるので（ADR 0017）、後勝ちを
        許すと失われるのは「相手が触った要素」ではなく相手の作業すべてになる。
        `baseUpdatedAt` が現在の版と違えば 409 を返し、何も書かない（ADR 0020）。

        シーンにはバイト数の上限がある。超えたら縮小も切り捨てもせず 413 を
        返す（ADR 0018 と同じ扱い）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSceneRequest"
      responses:
        "200":
          description: 保存した。次の保存の基準になる版を返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveSceneResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 基準にした版が古い。他の誰かがすでに保存している
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/SceneTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/target:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [boards]
      operationId: setBoardTarget
      summary: draft issue の作成先をボードに設定する
      description: |
        利用者はリポジトリを選ぶが、保存するのはそのリポジトリに紐づく
        Projects v2。draft issue はリポジトリではなく Project に属するため
        （ADR 0014）。

        そのボードで draft issue を 1 件でも作った後は 409 を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTarget"
      responses:
        "200":
          description: 設定後のボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでに draft issue を作っているので作成先を変えられない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/target/display:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [boards]
      operationId: refreshBoardTargetDisplay
      summary: 作成先の表示用スナップショットだけを取り直す
      description: |
        `projectNumber` / `projectTitle` / `projectUrl` は作成先を選んだ時点の
        スナップショットで、判定には使わない（ADR 0019 / 0025）。GitHub 側で
        Project を改名すると古いままになるが、**作成先そのものは固定済みで
        変えられない**（ADR 0014）ため、選び直しでは直せなかった。この口は
        表示用の 3 つだけを更新する（ADR 0037）。

        **作成先そのもの（リポジトリと projectId）は変えられない。**
        `projectId` は「どの作成先の表示名か」を確かめるために伴う。保存されて
        いるものと違えば 409（`target_mismatch`）を返す。作成先を変えるのは
        `PUT /api/boards/{id}/target` のほうで、固定後は通らない。

        **etoki からは自動で取りにいかない。** 画面が押されたときに GitHub の
        Project 一覧を引き、その値をここへ送る（中核思想 3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTargetDisplay"
      responses:
        "200":
          description: 更新後のボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 送られた projectId が保存されている作成先と違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: そのボードには作成先が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/access:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [boards]
      operationId: getBoardAccess
      summary: そのボードで何ができるかを返す
      description: |
        etoki 側のロールと、GitHub 側の書き込み可否を**別々に**返す（ADR 0017）。
        「開けるが書けない」が普通に起きるので、1 つに畳むと画面に出せない。

        `projectAccess` は**状態であって判定ではない。** 実際に作れるかは作成時に
        GitHub が返したものが正しい。これを見て作成を止めるのではなく、
        できない理由を先に見せるために使う。

        ボード取得とは別の呼び出しにしてある。GitHub が未設定・不通でもボードは
        開ける必要がある。
      responses:
        "200":
          description: 権限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/members:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [members]
      operationId: listBoardMembers
      summary: ボードのメンバーを返す
      description: |
        メンバーなら誰でも見られる。誰と共有しているかを owner だけが知って
        いる状態にすると、招待された側は自分が何に呼ばれたのか分からない。
      responses:
        "200":
          description: メンバー
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [members]
      operationId: inviteBoardMember
      summary: メンバーを招待する
      description: |
        招待できるのは owner だけ。**招待される側にリポジトリのアクセス権は
        要らない**（ADR 0017）。ブレストに呼ぶ相手と、GitHub に書ける相手は
        同じではない。

        指す相手は login だが、一度 etoki にログインしている必要がある。
        未ログインの login 宛に招待を積むと、改名で空いた login を取った別人に
        権限が渡る。その場合は 400 を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: 招待した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでにメンバー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [members]
      operationId: setBoardMemberRole
      summary: メンバーのロールを変える
      description: |
        owner だけ。最後の owner は降格できない。誰も招待できず作成先も
        変えられないボードが残るため。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
      responses:
        "200":
          description: 変更後のメンバー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 最後の owner は降格できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [members]
      operationId: removeBoardMember
      summary: メンバーを外す
      description: owner だけ。最後の owner は外せない。
      responses:
        "204":
          description: 外した
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 最後の owner は外せない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/github/repositories:
    get:
      tags: [github]
      operationId: listRepositories
      summary: 作成先に選べるリポジトリの一覧を返す
      description: |
        アーカイブ済みは含めない。トークンに repo の read が無いと 0 件になるが、
        権限不足と「本当に 1 つも無い」は区別できない。
      responses:
        "200":
          description: リポジトリの一覧。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: GitHub の呼び出しに失敗した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/github/repositories/{owner}/{repo}/projects:
    parameters:
      - $ref: "#/components/parameters/RepositoryOwner"
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [github]
      operationId: listRepositoryProjects
      summary: リポジトリに紐づく Projects v2 の一覧を返す
      description: 閉じた Project は含めない。
      responses:
        "200":
          description: Projects v2 の一覧。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: GitHub の呼び出しに失敗した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/boards/{id}/annotations:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [annotations]
      operationId: listAnnotations
      summary: 注釈の 3 状態を返す
      description: |
        保存済みシーンから注釈を取り出し、最新の run の content_hash と
        突き合わせて uncreated / created / changed を決める。
      responses:
        "200":
          description: 注釈の状態。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/annotations/{annotationId}/runs:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AnnotationId"
    get:
      tags: [annotations]
      operationId: listAnnotationRuns
      summary: その注釈の実行履歴を返す
      description: |
        再実行しても過去の run は消さない（ADR 0007）。**残す理由は追跡なので、
        読む口が無いと残している意味が無い。** GitHub 側に何世代ぶんの draft
        issue が在るのかは、ここでしか辿れない。

        並びは新しい順。**新しさは `createdAt` ではなく `id` で決める。** 時刻は
        呼び出し側が与えるので、同じ時刻の run がありうる。

        返すのは直近のぶんだけで、件数の上限はサーバーが決める。範囲指定は
        持たない（数え上げではなく「直前に何をしたか」を辿るための口なので、
        遡り続ける導線を作る理由が無い）。

        **`AnnotationStatus.items` とは別物。** あちらは run 履歴を itemId で
        畳んだ「いま GitHub に在るもの」で、こちらは畳む前の 1 回ずつの記録
        （ADR 0026）。
      responses:
        "200":
          description: 実行の履歴。新しい順。一度も実行していなければ空配列
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/diagram-draft:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [boards]
      operationId: generateDiagramDraft
      summary: プロンプトから図のドラフトを生成する
      description: |
        **サーバーの状態を一切変えない**（ADR 0041）。DB にも GitHub にも触れず、
        会話も保存しない。返した mermaid をキャンバスに置くかどうかは、見てから
        開発者が決める（中核思想 3）。

        **保存済みシーンを読まないので、未保存でも使える。** 解釈が保存を
        要求する（ADR 0018）のとは非対称だが、手抜きではなく副作用の有無から
        出る違い。

        注釈でも解釈でもないので、パスはボードの直下に置く。囲みとは無関係で、
        キャンバスに何も無くても呼べる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDiagramRequest"
      responses:
        "200":
          description: 生成された図のドラフト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/DiagramChatTooLong"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: LLM の呼び出しに失敗した、または図が返らなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: LLM が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/boards/{id}/annotations/{annotationId}/interpret:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [annotations]
      operationId: interpretAnnotation
      summary: 注釈を LLM に解釈させる
      description: |
        GitHub には何も作らず、sync_runs にも書かない。何を作るかは結果を見た
        開発者が別途トリガーする（中核思想 3）。

        テキストは保存済みシーンから取る。`image` はフロントが書き出した注釈
        範囲の画像で、矢印やグルーピングのようにテキストに現れない構造を渡す
        ためのもの（ADR 0018）。ボディごと省略できる。
      requestBody:
        required: false
        description: |
          省略すると、これまでどおりテキストだけで解釈する。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpretRequest"
      responses:
        "200":
          description: 解釈の結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interpretation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: LLM の呼び出しに失敗した、または出力がスキーマを満たさなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: LLM が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/boards/{id}/annotations/{annotationId}/items:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [annotations]
      operationId: createItems
      summary: 解釈結果から draft issue を作る
      description: |
        リクエストボディは開発者が確認した解釈結果そのもの。サーバー側で解釈し
        直さない。ただし内容は信用せず、ユースケース層で検証し直す。

        `contentHash` は解釈時点の保存済みシーンのもの。現在のシーンと食い違うと
        409 を返す（ADR 0010）。
      requestBody:
        required: true
        description: 解釈のエンドポイントが返したものをそのまま送り返す
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Interpretation"
      responses:
        "201":
          description: |
            作成した run。途中で失敗した場合も、作れたぶんは items に入り
            `incomplete` が立つ（ADR 0009）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            解釈時点と現在のシーンの contentHash が食い違うか、`previousItemId` が
            その注釈のものではない。どちらも解釈からやり直す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            ボードに作成先が設定されていない、または Projects v2 側に必要な
            フィールドが無い
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: GitHub への作成が 1 件も成功しなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    BoardId:
      name: id
      in: path
      required: true
      description: ボードの ID
      schema:
        type: string

    AnnotationId:
      name: annotationId
      in: path
      required: true
      description: 注釈にした frame の要素 ID
      schema:
        type: string

    UserId:
      name: userId
      in: path
      required: true
      description: |
        etoki が発番した利用者の ID。login ではない。login は改名で変わるので、
        指し先としては使えない（ADR 0015）。
      schema:
        type: string

    RepositoryOwner:
      name: owner
      in: path
      required: true
      description: リポジトリ所有者の login
      schema:
        type: string

    RepositoryName:
      name: repo
      in: path
      required: true
      description: リポジトリ名
      schema:
        type: string

  responses:
    BadRequest:
      description: リクエストの内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: |
        ログインしていない、またはセッションが失効した。認証を設定している
        場合にだけ起こる（ADR 0015）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: |
        次のどれか。

        - Host または Origin が許可されていない。ブラウザ由来の cross-site
          リクエストを弾いた場合（ADR 0013）。全エンドポイントで起こりうる
        - ボードのメンバーではあるが、その操作にロールが足りない（ADR 0017）。
          **メンバーでない場合は 404。** 区別すると ID を総当たりして他人の
          ボードの存在を確かめられる
        - GitHub がその Project への書き込みを拒んだ。etoki は実行者の
          トークンで叩くので、リポジトリのアクセス権が無ければここに来る
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    SceneTooLarge:
      description: |
        シーンが保存できる大きさを超えている。**縮小も切り捨てもせずに弾く**
        （ADR 0018 と同じ扱い）。効いてくるのはキャンバスに貼った画像で、
        シーンには base64 で丸ごと乗る。

        400 ではないのは、中身の誤りではなく大きさだから。打ち手が「送った
        内容を直す」ではなく「貼った画像を減らす」になる。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DiagramChatTooLong:
      description: |
        図のドラフトの会話が上限を超えている。往復の回数か、会話全体の長さの
        どちらか。

        **黙って古いやりとりを捨てない。** 捨てると、積み上げた指示のどれが
        効いているのかが分からなくなる。やり直すかどうかは開発者が決める
        （中核思想 3）。

        400 ではないのは大きさだから。送られた内容は正しく、打ち手が「送った
        内容を直す」ではなく「会話をやり直す」になる（SceneTooLarge と同じ）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotConfigured:
      description: |
        その機能に必要な設定がされていない。URL の誤りではないので 404 に
        しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: 対象が見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: サーバー側の想定外の失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AuthUser:
      type: object
      description: ログイン中の利用者
      required: [provider, login, displayName]
      properties:
        provider:
          type: string
          description: 認証基盤の識別子。"github" など
        login:
          type: string
        displayName:
          type: string

    Capabilities:
      type: object
      description: |
        いま使える機能。**プロセスの設定であって、利用者ごとの権限ではない。**

        false のものは押す前に理由を出すために使う。理由の文言は `ErrorCode` の
        `*_not_configured` と同じものを引く。そのエンドポイントを叩けば同じ
        原因で 503 が返るので、**先に見せる文言と後から返る理由を別に持たない。**
      required: [interpretation, diagramDraft, creation, sharing]
      properties:
        interpretation:
          type: boolean
          description: 注釈を解釈できるか。false は LLM が未設定（ADR 0008）
        diagramDraft:
          type: boolean
          description: |
            プロンプトから図のドラフトを生成できるか。false は LLM が未設定。

            **`interpretation` と畳まない。** 未設定の理由も設定するものも
            同じだが、答えている問いが違う。1 つにすると、画面はどちらの
            ボタンを止めればよいのかをこの値から決められなくなる
        creation:
          type: boolean
          description: |
            draft issue を作れるか。false は GitHub が未設定。**作成先の候補も
            引けない**ので、新しいボードも作れない（ADR 0017）
        sharing:
          type: boolean
          description: |
            ボードを共有できるか。false は認証が未設定。招待は「誰であるか」が
            決まって初めて意味を持つ（ADR 0016 / 0017）

    SessionStatus:
      type: object
      description: |
        ログイン状態。認証を設定していない構成でも 200 で返る。
      required: [authRequired, authenticated]
      properties:
        authRequired:
          type: boolean
          description: |
            認証を設定しているか。false なら画面はログインを求めない
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"

    LoginResponse:
      type: object
      description: 認可画面へ送り出すための URL
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string

    HealthResponse:
      type: object
      description: /healthz のレスポンスボディ
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorCode:
      type: string
      description: |
        失敗の原因を表す機械可読な符号。**画面はこれで打ち手を分ける。**

        ステータスだけでは打ち手が決まらない。409 には「開き直す」「諦める」
        「解釈からやり直す」「入力を変える」が同居していて、利用者がすべきことは
        すべて違う。403 も etoki のロール不足（`forbidden_role`）と GitHub 側の
        拒否（`forbidden_project`）で直す場所が違い、2 層に分けて持つと決めた
        （ADR 0017）のに、文言に畳むと画面でその区別が消える。

        **`*_not_configured` を 1 つに畳まない。** 設定するものが違うので、
        畳むと画面が「何を設定すればよいか」を言えなくなる。
      enum:
        - invalid_input
        - login_required
        - forbidden_role
        - forbidden_project
        - cross_site_rejected
        - not_found
        - scene_conflict
        - scene_too_large
        - target_locked
        - target_mismatch
        - content_hash_mismatch
        - previous_item_unknown
        - already_member
        - last_owner
        - target_not_selected
        - project_field_missing
        - llm_unavailable
        - interpretation_failed
        - diagram_failed
        - diagram_chat_too_long
        - creation_incomplete
        - github_unavailable
        - internal
        - llm_not_configured
        - github_not_configured
        - auth_not_configured
        - sharing_not_configured

    ErrorResponse:
      type: object
      description: |
        失敗したときの本文。打ち手は `code` で分け、`error` は手掛かりに留める。
      required: [error, code]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        error:
          type: string
          description: |
            原因の手掛かり。**利用者向けの文言ではない。** 画面は既定で畳む。
            GitHub や LLM が返した本文が実際の手掛かりになる経路があるので残す

    SyncState:
      type: string
      description: |
        注釈の 3 状態。保存済みシーンの content_hash と最新 run のそれを
        突き合わせて決まる。
      enum:
        - uncreated
        - created
        - changed

    Granularity:
      type: string
      description: |
        注釈の粒度。空文字は「指定なし」で、粒度の判断を LLM に任せる。
      enum:
        - ""
        - epic
        - issue

    DiagramKind:
      type: string
      description: |
        図の種類。**語彙はここ 1 つ**で、ブレストの出発点になるテンプレートと、
        プロンプトから生成するドラフトが同じ 5 種を指す。

        - `todo` … やることの洗い出し
        - `mindmap` … 発想の広げ方
        - `sequence` … 登場人物とやりとりの順序
        - `er` … 実体と関連
        - `architecture` … 構成要素と境界

        **どの mermaid 記法で書くかはサーバーが決める**（ADR 0041）。
        `mindmap` と `architecture` は mermaid にも同名の記法があるが、
        Excalidraw の要素に分解できず画像 1 枚になるため使わない（ADR 0040）。
      enum:
        - todo
        - mindmap
        - sequence
        - er
        - architecture

    ItemKind:
      type: string
      description: |
        GitHub に作る draft issue の種別。作るのは epic と issue の 2 階層のみ
        （ADR 0006）。
      enum:
        - epic
        - issue

    BoardRole:
      type: string
      description: |
        ボードに対する権限の強さ（ADR 0017）。

        - `owner` … 招待とロール変更、作成先の変更ができる
        - `editor` … ブレストと解釈と draft issue の作成ができる。作成できるかを
          最終的に決めるのは GitHub
        - `viewer` … 読むだけ。解釈も許さない。解釈は LLM を叩く外部呼び出しで
          あり、閲覧者に許すのは「閲覧」ではない
      enum: [owner, editor, viewer]

    ProjectAccess:
      type: string
      description: |
        作成先の Project に書けるかどうかの、いまの状態。

        - `allowed` … 書ける
        - `denied` … 書けない。招待されただけで、リポジトリのアクセス権を
          持たない利用者がこれになる
        - `unknown` … 確かめられなかった。GitHub が未設定、作成先が未選択、
          問い合わせに失敗した、のどれか。**allowed / denied のどちらにも
          倒さない。** 倒すと、確かめていないことを確かめたように見せることになる
      enum: [allowed, denied, unknown]

    BoardAccess:
      type: object
      description: そのボードで何ができるか。etoki 側と GitHub 側を別々に返す
      required: [role, projectAccess]
      properties:
        role:
          $ref: "#/components/schemas/BoardRole"
        projectAccess:
          $ref: "#/components/schemas/ProjectAccess"

    BoardMember:
      type: object
      description: ボードのメンバー 1 人
      required: [userId, login, displayName, role, createdAt]
      properties:
        userId:
          type: string
          description: etoki が発番した ID。指し先にはこれを使う
        login:
          type: string
          description: |
            認証基盤上のログイン名。表示用。移行前のボードなど、利用者を
            引けない場合は空文字になる
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/BoardRole"
        createdAt:
          type: string
          format: date-time

    InviteMemberRequest:
      type: object
      description: 招待のリクエストボディ
      required: [login, role]
      properties:
        login:
          type: string
          description: 招待する相手の login。一度 etoki にログインしている必要がある
        role:
          $ref: "#/components/schemas/BoardRole"

    SetMemberRoleRequest:
      type: object
      description: ロール変更のリクエストボディ
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/BoardRole"

    BoardSummary:
      type: object
      description: |
        一覧で返すボード。シーンは大きいので含めない。

        作成先は含める。一覧をリポジトリと Project でまとめて見せるため
        （ADR 0019）。含めないのは `targetLocked` だけで、これは算出に run の
        照会が要り、ボード数だけ問い合わせが増える。
      required:
        [
          id,
          name,
          role,
          createdAt,
          updatedAt,
          repositoryOwner,
          repositoryName,
          projectId,
          projectNumber,
          projectTitle,
          projectUrl,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/BoardRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        repositoryOwner:
          type: string
          description: 作成先リポジトリの所有者。未選択なら空文字
        repositoryName:
          type: string
          description: 作成先リポジトリの名前。未選択なら空文字
        projectId:
          type: string
          description: draft issue を作る Projects v2 の node ID。未選択なら空文字
        projectNumber:
          type: integer
          description: |
            作成先 Project の番号。作成先を選んだ時点のスナップショット
            （ADR 0019）。取得していなければ 0
        projectTitle:
          type: string
          description: |
            作成先 Project の名前。作成先を選んだ時点のスナップショット
            （ADR 0019）。取得していなければ空文字
        projectUrl:
          type: string
          description: |
            作成先 Project の URL。作成先を選んだ時点のスナップショット
            （ADR 0025）。取得していなければ空文字。

            番号から組み立てたものではなく GitHub が返したもの。Projects v2 の
            URL は owner が user か org かで形が変わり、etoki はどちらなのかを
            知らない

    BoardDetail:
      description: シーンと作成先の固定状態を加えたボード
      allOf:
        - $ref: "#/components/schemas/BoardSummary"
        - type: object
          required: [scene, targetLocked]
          properties:
            scene:
              type: string
              description: Excalidraw のシーン JSON をそのまま入れた文字列
            targetLocked:
              type: boolean
              description: |
                作成先を変更できないことを表す。そのボードで draft issue を
                1 件でも作ると立つ（ADR 0014）。フロントは sync_runs を
                数えられないので、状態としてサーバーが返す

    BoardDeletion:
      type: object
      description: |
        ボードを削除したときに etoki から失われるもの（ADR 0042）。

        **GitHub 側で何が起きるかは含まれない。** etoki は draft issue を
        消さないので、GitHub にはそのまま残る。ここが答えるのは「辿れなく
        なるのはどれだけか」という問いのほう。
      required: [recordedItemCount]
      properties:
        recordedItemCount:
          type: integer
          description: |
            そのボードから作成したと etoki が記録している draft issue の件数。

            数え方は注釈のカードに出している「いま GitHub に在る N 件」と同じ
            畳み込み（ADR 0026）。**GitHub 上でまだ在るかどうかは etoki には
            分からない**（ADR 0007）ので、これは記録の件数であって現況では
            ない

    BoardTarget:
      type: object
      description: |
        draft issue の作成先。設定のリクエストボディ。

        リポジトリと Project の両方を持つ。保存先として効くのは projectId
        だが、どのリポジトリから選んだかを画面に出すために owner / name も残す。

        projectNumber と projectTitle と projectUrl は**表示用のスナップショット**
        であり、作成先そのものではない（ADR 0019 / 0025）。未選択の判定にも、
        固定済みかどうかの判定にも使わない。選ばせた画面が見せていたものを
        そのまま送る。

        表示用の 3 つは任意。省略すると「知らない」（0 と空文字）として保存する。
        必須にすると、画面を通さない呼び出し側が値をでっち上げることになる。
      required: [repositoryOwner, repositoryName, projectId]
      properties:
        repositoryOwner:
          type: string
        repositoryName:
          type: string
        projectId:
          type: string
        projectNumber:
          type: integer
          x-go-type-skip-optional-pointer: true
        projectTitle:
          type: string
          x-go-type-skip-optional-pointer: true
        projectUrl:
          type: string
          x-go-type-skip-optional-pointer: true

    BoardTargetDisplay:
      type: object
      description: |
        作成先の表示用スナップショット。取り直しのリクエストボディ（ADR 0037）。

        `projectId` は**変更先ではなく照合材料**。どの作成先の表示名なのかを
        示すために伴い、保存されているものと違えば 409 になる。リポジトリを
        持たないのは、この口で作成先そのものを動かせないことを形で示すため。

        表示用の 3 つは任意。省略すると「知らない」（0 と空文字）として保存
        する。BoardTarget と同じ扱いにしてあるので、GitHub が URL を返さない
        Project でも取り直せる。
      required: [projectId]
      properties:
        projectId:
          type: string
          description: いま保存されている作成先の Projects v2 node ID
        projectNumber:
          type: integer
          x-go-type-skip-optional-pointer: true
        projectTitle:
          type: string
          x-go-type-skip-optional-pointer: true
        projectUrl:
          type: string
          x-go-type-skip-optional-pointer: true

    Repository:
      type: object
      description: 作成先を選ぶときに見せるリポジトリ
      required: [owner, name]
      properties:
        owner:
          type: string
        name:
          type: string
        description:
          type: string
          x-go-type-skip-optional-pointer: true

    Project:
      type: object
      description: リポジトリに紐づく Projects v2
      required: [id, number, title, url]
      properties:
        id:
          type: string
          description: GraphQL の node ID。作成先として保存するのはこれ
        number:
          type: integer
          description: リポジトリ内での番号。GitHub の URL に出る
        title:
          type: string
        url:
          type: string
          description: |
            Project のページ。**番号から組み立てず GitHub が返したものを運ぶ。**
            Projects v2 の URL は owner が user か org かで形が変わり、etoki は
            どちらなのかを知らない（ADR 0025）

    CreateBoardRequest:
      type: object
      description: |
        ボード作成のリクエストボディ。

        **作成先は必須。** 候補は `minPermissionLevel: WRITE` で絞ってあるので
        （ADR 0014）、書ける Project を 1 つも持たない人はボードを作れない。
        「ボードの作成にはリポジトリへのアクセス権が要る」はこれで満ちる
        （ADR 0017）。

        副産物として、作成先が未選択のボードは新規には生まれなくなる。移行前の
        ボードは未選択のまま残るので、`projectId` が空文字の経路は消えない。
      required: [name, repositoryOwner, repositoryName, projectId]
      properties:
        name:
          type: string
        repositoryOwner:
          type: string
        repositoryName:
          type: string
        projectId:
          type: string
          description: draft issue を作る Projects v2 の node ID
        projectNumber:
          type: integer
          description: |
            作成先 Project の番号。表示用のスナップショット（ADR 0019）。
            省略すると 0（名前を知らない）で保存する
          x-go-type-skip-optional-pointer: true
        projectTitle:
          type: string
          description: |
            作成先 Project の名前。表示用のスナップショット（ADR 0019）。
            省略すると空文字（名前を知らない）で保存する
          x-go-type-skip-optional-pointer: true
        projectUrl:
          type: string
          description: |
            作成先 Project の URL。表示用のスナップショット（ADR 0025）。
            省略すると空文字（URL を知らない）で保存する
          x-go-type-skip-optional-pointer: true
        scene:
          type: string
          description: 省略すると空のシーンで作る
          x-go-type-skip-optional-pointer: true

    RenameBoardRequest:
      type: object
      description: |
        改名のリクエストボディ。

        名前だけを持つ。作成先やシーンを一緒に送れる形にすると、この経路でも
        作成先を書けることになり、固定（ADR 0014）が意味を失う。
      required: [name]
      properties:
        name:
          type: string
          description: 新しい名前。空文字と空白だけは弾く

    SaveSceneRequest:
      type: object
      description: |
        シーン保存のリクエストボディ。

        `baseUpdatedAt` は任意にしない。任意にすると API を直接叩く経路で照合を
        素通りでき、防ぎたい後勝ちがそのまま残る（ADR 0010 と同じ理由）。
      required: [scene, baseUpdatedAt]
      properties:
        scene:
          type: string
        baseUpdatedAt:
          type: string
          format: date-time
          description: |
            編集の基準にしたボードの `updatedAt`。取得時に返ったものをそのまま
            送り返す。現在の版と違えば 409 になり、シーンは書き換わらない
            （ADR 0020）

    SaveSceneResponse:
      type: object
      description: |
        保存後のボードの版。

        返さないと、クライアントは保存のたびにボードを取り直さないと次の保存が
        できない。取り直すとシーンまで運ぶことになる。
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: 保存後の `updatedAt`。次の保存の `baseUpdatedAt` になる

    SyncAction:
      type: string
      description: |
        1 つの run がその item に対して何をしたか（ADR 0026）。

        `created` は新しく作った、`updated` は既存の draft issue を書き換えた。
        記録していなかった頃の run はすべて `created`。当時は更新の経路が無かった。
      enum: [created, updated]

    SyncItem:
      type: object
      description: 作成済みの draft issue 1 件
      required: [itemId, kind, title, body, localId, action]
      properties:
        itemId:
          type: string
          description: GitHub Projects v2 の item ID
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        body:
          type: string
          description: 作成時の本文。記録していなかった頃の run では空
        localId:
          type: string
          description: 解釈結果の中でだけ通じる ID。親子の対応づけに使う
        parentLocalId:
          type: string
          description: epic に属する issue のとき、その epic の localId
          x-go-type-skip-optional-pointer: true
        action:
          $ref: "#/components/schemas/SyncAction"

    RunOutcome:
      type: string
      description: |
        run が最後まで進んだかどうか（ADR 0043）。

        **省略は「成功」ではなく「記録していない」。** この項目を足す前の run に
        は記録が無く、当時も途中失敗は起きていた。`complete` と同じに扱わない。
      enum: [complete, incomplete]

    SyncRun:
      type: object
      description: |
        1 つの注釈に対する 1 回ぶんの実行の記録（ADR 0007）。

        **「そのときの全体像」ではなく「その 1 回で何をしたか」**（ADR 0026）。
        触らなかった item はここには現れない。いま GitHub に在るものが知りたい
        なら `AnnotationStatus.items`（畳み込み）を見る。
      required: [id, createdAt, items]
      properties:
        id:
          type: integer
          format: int64
          description: |
            run の識別子。**新しさの順はこれで決まる**（時刻は呼び出し側が
            与えるので、同じ値の run がありうる）
        createdAt:
          type: string
          format: date-time
          description: 実行の時刻
        outcome:
          allOf:
            - $ref: "#/components/schemas/RunOutcome"
          description: |
            最後まで進んだかどうか。**記録していなかった頃の run では省略する**
            （ADR 0043）
        error:
          type: string
          description: |
            途中で失敗した理由。`outcome` が `incomplete` のときだけ入る。

            **利用者向けの文言ではなく手掛かり**なので、画面は既定で畳む
            （ADR 0034）
          x-go-type-skip-optional-pointer: true
        items:
          type: array
          description: |
            その run で作成または更新した draft issue。1 件も作れずに終わった
            実行は記録しないので、記録された run には 1 件以上入る（ADR 0009）
          items:
            $ref: "#/components/schemas/SyncItem"

    AnnotationStatus:
      type: object
      description: 注釈 1 つの状態
      required: [id, name, granularity, state]
      properties:
        id:
          type: string
        name:
          type: string
        granularity:
          $ref: "#/components/schemas/Granularity"
        state:
          $ref: "#/components/schemas/SyncState"
        lastSyncedAt:
          type: string
          format: date-time
          description: 前回実行の時刻。未実行なら省略する
        lastRunOutcome:
          allOf:
            - $ref: "#/components/schemas/RunOutcome"
          description: |
            前回実行が最後まで進んだかどうか（ADR 0043）。未実行と、記録して
            いなかった頃の run では省略する。

            **`state` は変わらない。** 途中で失敗しても作れたぶんは記録するので、
            状態は `created` になる（ADR 0009）。件数だけでは、途中で止まった
            のか、もともとその件数だったのかが読めないので別に出す。

            **理由はここには載せない。** 一覧は「何が起きたか」まで見せる場所で、
            手掛かりの本文は履歴（`GET .../runs`）が持つ
        items:
          type: array
          description: |
            この注釈が GitHub に在らしめている draft issue（ADR 0026）。

            **前回実行で作られたものではなく、run 履歴を itemId で畳んだもの。**
            更新は同じ itemId に吸収され、今回触らなかったものも残り続ける。
            最新 run だけを返すと、更新のあとに取り残しが画面から消える。
            1 件も無ければ省略する
          items:
            $ref: "#/components/schemas/SyncItem"
          x-go-type-skip-optional-pointer: true

    InterpretedItem:
      type: object
      description: 解釈結果に含まれる draft issue 1 件。まだ作成はしていない
      required: [localId, kind, title, body]
      properties:
        localId:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        body:
          type: string
        parentLocalId:
          type: string
          x-go-type-skip-optional-pointer: true
        previousItemId:
          type: string
          description: |
            書き換える対象の itemId（ADR 0026）。新しく作るなら省略する。

            解釈のレスポンスでは LLM が対応づけた候補が入る。作成のリクエストでは
            開発者が確かめた結果として送り返す。**サーバーはこの値がその注釈の
            ものであることを確かめる。** 確かめずに通すと、任意の node ID を
            書いて無関係な draft issue を書き換えられる
          x-go-type-skip-optional-pointer: true

    AnnotationImage:
      type: object
      description: |
        注釈の frame 範囲だけを写した画像。frame の外にある要素は含めない。

        サーバーは保存しない。解釈 1 回のあいだ LLM へ渡すためだけに使う
        （ADR 0018）。
      required: [mediaType, data]
      properties:
        mediaType:
          type: string
          description: 画像の MIME タイプ。PNG だけを受け付ける
          enum: ["image/png"]
        data:
          type: string
          format: byte
          description: |
            画像のバイト列を base64 で表したもの。デコード後のバイト数に上限が
            あり、超えると 400 を返す。上限は超えても縮小せず弾く。黙って劣化
            させると、渡したはずの情報が消えたことに気づけない（ADR 0018）

    InterpretRequest:
      type: object
      description: |
        解釈のリクエストボディ。テキストは保存済みシーンから取るので、ここには
        シーンから作れないものだけを載せる。
      properties:
        image:
          $ref: "#/components/schemas/AnnotationImage"

    DiagramTurn:
      type: object
      description: |
        図のドラフトを直してきたやりとり 1 往復。

        **サーバーは会話を保存しない**（ADR 0041）ので、ここまでの往復は毎回
        まるごと送る。会話は成果物ではなく、成果物はキャンバス。
      required: [prompt, mermaid]
      properties:
        prompt:
          type: string
          description: そのとき書いた指示
        mermaid:
          type: string
          description: それに対して返った mermaid

    GenerateDiagramRequest:
      type: object
      description: |
        図のドラフトを 1 つ作るための入力。**保存済みシーンもキャンバスも
        読まない**（ADR 0041）ので、未保存でも使える。
      required: [kind, prompt]
      properties:
        kind:
          $ref: "#/components/schemas/DiagramKind"
        prompt:
          type: string
          description: |
            今回の指示。空白だけのものは 400 で弾く。既定に倒さないのは、
            何を描くかが入力そのものであるため
        history:
          type: array
          description: |
            ここまでのやりとり。1 回目は空。**上限を超えたら黙って古いものを
            捨てず、`diagram_chat_too_long` で返す**
          items:
            $ref: "#/components/schemas/DiagramTurn"

    DiagramDraft:
      type: object
      description: |
        生成した図のドラフト。**キャンバスには置かれていない。** 置くかどうかは
        見てから開発者が決める（中核思想 3）。mermaid を Excalidraw の要素に
        するのはフロントの仕事（ADR 0040）。
      required: [kind, mermaid, turnsRemaining]
      properties:
        kind:
          $ref: "#/components/schemas/DiagramKind"
        mermaid:
          type: string
          description: 生成された mermaid。コードフェンスは外してある
        turnsRemaining:
          type: integer
          description: |
            このあと何往復できるか。**上限に当たってから知らせるのでは遅い**
            ので、押す前に見えるようにしている

    Interpretation:
      type: object
      description: |
        LLM が注釈をどう解釈したか。

        `summary` は GitHub には作らない。作成前に「こう読んだ」を見せるためだけに
        使う（ADR 0006）。

        作成のリクエストボディとしてもこの形をそのまま使う。開発者が確認した
        結果を送り返す、という流れなので別の型にしない。
      required: [summary, contentHash, items]
      properties:
        summary:
          type: string
        contentHash:
          type: string
          description: |
            解釈の入力になった保存済みシーンのハッシュ。フロントでは組み立てず、
            受け取ったものをそのまま送り返す
        items:
          type: array
          items:
            $ref: "#/components/schemas/InterpretedItem"

    CreatedRun:
      type: object
      description: 作成した run。途中で失敗しても、作れたぶんは items に入る
      required: [runId, createdAt, items]
      properties:
        runId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyncItem"
        incomplete:
          type: boolean
          description: 途中で失敗したことを表す
          x-go-type-skip-optional-pointer: true
        error:
          type: string
          description: 途中で失敗した理由
          x-go-type-skip-optional-pointer: true
