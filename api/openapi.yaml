openapi: 3.0.3

# etoki の HTTP 契約の正本（SSoT）。
#
# このファイルを直したら `make codegen` を実行して Go / TypeScript の型を
# 再生成し、同じコミットに含める。CI の codegen-drift ジョブが再生成して
# 差分が出たら落とす。詳細は docs/adr/0011-openapi-as-contract-ssot.md。
#
# Go は `x-go-type-skip-optional-pointer` で optional をポインタにしない。
# JSON の `omitempty` だけで表現できる場所にポインタを増やすと、詰め替えが
# 冗長になるうえ nil と空値の区別に意味が無い。区別に意味がある
# `lastSyncedAt`（未実行か、実行済みか）だけはポインタのままにする。

info:
  title: etoki API
  description: |
    ホワイトボードのブレスト内容を Vision LLM に解釈させ、GitHub Projects v2 の
    draft issue に変換するためのローカル API。

    単一ユーザーがローカルで動かす前提のため、認証・認可は持たない（ADR 0004）。
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: ローカル開発サーバー

tags:
  - name: health
    description: 死活確認
  - name: boards
    description: ボードとシーンの読み書き
  - name: annotations
    description: 注釈の状態・解釈・作成
  - name: github
    description: 作成先を選ぶための GitHub の一覧

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: プロセスが生きていることを返す
      description: |
        DB や外部サービスの疎通確認は含めない。etoki は自動で外部に触らないという
        方針のため、ヘルスチェックが副作用を持たないようにしている。
      responses:
        "200":
          description: プロセスは生きている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/boards:
    get:
      tags: [boards]
      operationId: listBoards
      summary: ボードの一覧を返す
      description: シーンは大きいので一覧には含めない。
      responses:
        "200":
          description: ボードの一覧。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [boards]
      operationId: createBoard
      summary: ボードを作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: 作成したボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [boards]
      operationId: getBoard
      summary: ボードをシーンごと返す
      responses:
        "200":
          description: ボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/scene:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [boards]
      operationId: saveScene
      summary: シーンを保存する
      description: |
        3 状態の判定は保存済みシーンを基準にする。保存するまで編集中の内容は
        注釈の状態に反映されない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSceneRequest"
      responses:
        "204":
          description: 保存した
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/target:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [boards]
      operationId: setBoardTarget
      summary: draft issue の作成先をボードに設定する
      description: |
        利用者はリポジトリを選ぶが、保存するのはそのリポジトリに紐づく
        Projects v2。draft issue はリポジトリではなく Project に属するため
        （ADR 0014）。

        そのボードで draft issue を 1 件でも作った後は 409 を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTarget"
      responses:
        "200":
          description: 設定後のボード
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでに draft issue を作っているので作成先を変えられない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/github/repositories:
    get:
      tags: [github]
      operationId: listRepositories
      summary: 作成先に選べるリポジトリの一覧を返す
      description: |
        アーカイブ済みは含めない。トークンに repo の read が無いと 0 件になるが、
        権限不足と「本当に 1 つも無い」は区別できない。
      responses:
        "200":
          description: リポジトリの一覧。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: GitHub の呼び出しに失敗した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/github/repositories/{owner}/{repo}/projects:
    parameters:
      - $ref: "#/components/parameters/RepositoryOwner"
      - $ref: "#/components/parameters/RepositoryName"
    get:
      tags: [github]
      operationId: listRepositoryProjects
      summary: リポジトリに紐づく Projects v2 の一覧を返す
      description: 閉じた Project は含めない。
      responses:
        "200":
          description: Projects v2 の一覧。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: GitHub の呼び出しに失敗した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/boards/{id}/annotations:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [annotations]
      operationId: listAnnotations
      summary: 注釈の 3 状態を返す
      description: |
        保存済みシーンから注釈を取り出し、最新の run の content_hash と
        突き合わせて uncreated / created / changed を決める。
      responses:
        "200":
          description: 注釈の状態。0 件でも配列を返す
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/boards/{id}/annotations/{annotationId}/interpret:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [annotations]
      operationId: interpretAnnotation
      summary: 注釈を LLM に解釈させる
      description: |
        GitHub には何も作らず、sync_runs にも書かない。何を作るかは結果を見た
        開発者が別途トリガーする（中核思想 3）。
      responses:
        "200":
          description: 解釈の結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interpretation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: LLM の呼び出しに失敗した、または出力がスキーマを満たさなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: LLM が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/boards/{id}/annotations/{annotationId}/items:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [annotations]
      operationId: createItems
      summary: 解釈結果から draft issue を作る
      description: |
        リクエストボディは開発者が確認した解釈結果そのもの。サーバー側で解釈し
        直さない。ただし内容は信用せず、ユースケース層で検証し直す。

        `contentHash` は解釈時点の保存済みシーンのもの。現在のシーンと食い違うと
        409 を返す（ADR 0010）。
      requestBody:
        required: true
        description: 解釈のエンドポイントが返したものをそのまま送り返す
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Interpretation"
      responses:
        "201":
          description: |
            作成した run。途中で失敗した場合も、作れたぶんは items に入り
            `incomplete` が立つ（ADR 0009）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 解釈時点と現在のシーンの contentHash が食い違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            ボードに作成先が設定されていない、または Projects v2 側に必要な
            フィールドが無い
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: GitHub への作成が 1 件も成功しなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub が設定されていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    BoardId:
      name: id
      in: path
      required: true
      description: ボードの ID
      schema:
        type: string

    AnnotationId:
      name: annotationId
      in: path
      required: true
      description: 注釈にした frame の要素 ID
      schema:
        type: string

    RepositoryOwner:
      name: owner
      in: path
      required: true
      description: リポジトリ所有者の login
      schema:
        type: string

    RepositoryName:
      name: repo
      in: path
      required: true
      description: リポジトリ名
      schema:
        type: string

  responses:
    BadRequest:
      description: リクエストの内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: |
        Host または Origin が許可されていない。ブラウザ由来の cross-site
        リクエストを弾いた場合（ADR 0013）。全エンドポイントで起こりうる。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: 対象が見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: サーバー側の想定外の失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      description: /healthz のレスポンスボディ
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      description: |
        失敗したときの本文。内部情報は載せない。原因の詳細はサーバー側のログに残す。
      required: [error]
      properties:
        error:
          type: string

    SyncState:
      type: string
      description: |
        注釈の 3 状態。保存済みシーンの content_hash と最新 run のそれを
        突き合わせて決まる。
      enum:
        - uncreated
        - created
        - changed

    Granularity:
      type: string
      description: |
        注釈の粒度。空文字は「指定なし」で、粒度の判断を LLM に任せる。
      enum:
        - ""
        - epic
        - issue

    ItemKind:
      type: string
      description: |
        GitHub に作る draft issue の種別。作るのは epic と issue の 2 階層のみ
        （ADR 0006）。
      enum:
        - epic
        - issue

    BoardSummary:
      type: object
      description: 一覧で返すボード。シーンは大きいので含めない
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BoardDetail:
      description: |
        シーンと作成先を含むボード。

        作成先は一覧（BoardSummary）には含めない。`targetLocked` の算出に
        run の照会が要るので、ボード数だけ問い合わせが増える。
      allOf:
        - $ref: "#/components/schemas/BoardSummary"
        - type: object
          required:
            [scene, repositoryOwner, repositoryName, projectId, targetLocked]
          properties:
            scene:
              type: string
              description: Excalidraw のシーン JSON をそのまま入れた文字列
            repositoryOwner:
              type: string
              description: 作成先リポジトリの所有者。未選択なら空文字
            repositoryName:
              type: string
              description: 作成先リポジトリの名前。未選択なら空文字
            projectId:
              type: string
              description: draft issue を作る Projects v2 の node ID。未選択なら空文字
            targetLocked:
              type: boolean
              description: |
                作成先を変更できないことを表す。そのボードで draft issue を
                1 件でも作ると立つ（ADR 0014）。フロントは sync_runs を
                数えられないので、状態としてサーバーが返す

    BoardTarget:
      type: object
      description: |
        draft issue の作成先。設定のリクエストボディ。

        リポジトリと Project の両方を持つ。保存先として効くのは projectId
        だが、どのリポジトリから選んだかを画面に出すために owner / name も残す。
      required: [repositoryOwner, repositoryName, projectId]
      properties:
        repositoryOwner:
          type: string
        repositoryName:
          type: string
        projectId:
          type: string

    Repository:
      type: object
      description: 作成先を選ぶときに見せるリポジトリ
      required: [owner, name]
      properties:
        owner:
          type: string
        name:
          type: string
        description:
          type: string
          x-go-type-skip-optional-pointer: true

    Project:
      type: object
      description: リポジトリに紐づく Projects v2
      required: [id, number, title]
      properties:
        id:
          type: string
          description: GraphQL の node ID。作成先として保存するのはこれ
        number:
          type: integer
          description: リポジトリ内での番号。GitHub の URL に出る
        title:
          type: string

    CreateBoardRequest:
      type: object
      description: ボード作成のリクエストボディ
      required: [name]
      properties:
        name:
          type: string
        scene:
          type: string
          description: 省略すると空のシーンで作る
          x-go-type-skip-optional-pointer: true

    SaveSceneRequest:
      type: object
      description: シーン保存のリクエストボディ
      required: [scene]
      properties:
        scene:
          type: string

    SyncItem:
      type: object
      description: 作成済みの draft issue 1 件
      required: [itemId, kind, title, localId]
      properties:
        itemId:
          type: string
          description: GitHub Projects v2 の item ID
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        localId:
          type: string
          description: 解釈結果の中でだけ通じる ID。親子の対応づけに使う
        parentLocalId:
          type: string
          description: epic に属する issue のとき、その epic の localId
          x-go-type-skip-optional-pointer: true

    AnnotationStatus:
      type: object
      description: 注釈 1 つの状態
      required: [id, name, granularity, state]
      properties:
        id:
          type: string
        name:
          type: string
        granularity:
          $ref: "#/components/schemas/Granularity"
        state:
          $ref: "#/components/schemas/SyncState"
        lastSyncedAt:
          type: string
          format: date-time
          description: 前回実行の時刻。未実行なら省略する
        items:
          type: array
          description: 前回実行で作られた draft issue。未実行なら省略する
          items:
            $ref: "#/components/schemas/SyncItem"
          x-go-type-skip-optional-pointer: true

    InterpretedItem:
      type: object
      description: 解釈結果に含まれる draft issue 1 件。まだ作成はしていない
      required: [localId, kind, title, body]
      properties:
        localId:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        body:
          type: string
        parentLocalId:
          type: string
          x-go-type-skip-optional-pointer: true

    Interpretation:
      type: object
      description: |
        LLM が注釈をどう解釈したか。

        `summary` は GitHub には作らない。作成前に「こう読んだ」を見せるためだけに
        使う（ADR 0006）。

        作成のリクエストボディとしてもこの形をそのまま使う。開発者が確認した
        結果を送り返す、という流れなので別の型にしない。
      required: [summary, contentHash, items]
      properties:
        summary:
          type: string
        contentHash:
          type: string
          description: |
            解釈の入力になった保存済みシーンのハッシュ。フロントでは組み立てず、
            受け取ったものをそのまま送り返す
        items:
          type: array
          items:
            $ref: "#/components/schemas/InterpretedItem"

    CreatedRun:
      type: object
      description: 作成した run。途中で失敗しても、作れたぶんは items に入る
      required: [runId, createdAt, items]
      properties:
        runId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyncItem"
        incomplete:
          type: boolean
          description: 途中で失敗したことを表す
          x-go-type-skip-optional-pointer: true
        error:
          type: string
          description: 途中で失敗した理由
          x-go-type-skip-optional-pointer: true
