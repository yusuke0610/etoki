# golangci-lint v2 形式。v1 とはキー構成が異なるので注意。
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    # 誤検知は行ごとに `//nolint:gosec // 理由` で外す。設定でまとめて外すと、
    # 同じ形の本物（たとえば値を連結した SQL）まで黙って通る（#64）。
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          # 公開 API 面（etoki.go / port/）は外部リポジトリが直接読むため、
          # doc コメントを必須にする。
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    # web/node_modules には Go ファイルを同梱した npm パッケージが混ざる。
    # モジュール外なので走査対象から外す。
    paths:
      - "^web/"
    rules:
      - path: _test\.go$
        linters:
          - unparam
          # テストの偽のトークン（G101）と、添字から文字を作る変換（G115）しか
          # 出ない。どちらも守る対象が無い。
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yusuke0610/etoki
  exclusions:
    paths:
      - "^web/"
